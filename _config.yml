# -----------------------------------------------------------------------------
# Scholar
# -----------------------------------------------------------------------------

scholar_userid: gBhmvr8AAAAJ
semanticscholar_id:         # add if you have one

# -----------------------------------------------------------------------------
# Social — ONLY Scholar and Email shown
# -----------------------------------------------------------------------------

github_username:            # intentionally blank
linkedin_username:          # intentionally blank
twitter_username:           # intentionally blank
orcid_id:                   # add if needed

# -----------------------------------------------------------------------------
# Analytics — disabled for now
# -----------------------------------------------------------------------------

google_analytics:
cronitor_analytics:

# -----------------------------------------------------------------------------
# Theme / Layout
# -----------------------------------------------------------------------------

navbar_fixed: false
footer_fixed: false
search_enabled: true
bib_search: true
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true
enable_medium_zoom: true
enable_publication_thumbnails: true
enable_publication_badges: true

# -----------------------------------------------------------------------------
# Blog — disabled
# -----------------------------------------------------------------------------

blog_name:
blog_description:
permalink: /blog/:year/:title/
lsi: false
future: false

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: false
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/
  courses:
    output: true
    permalink: /teaching/:path/
  members:
    output: true
    permalink: /group/:path/

defaults:
  - scope:
      path: ""
      type: courses
    values:
      layout: course
  - scope:
      path: ""
      type: projects
    values:
      layout: page
  - scope:
      path: ""
      type: members
    values:
      layout: page

# -----------------------------------------------------------------------------
# Jekyll Scholar — Publications
# -----------------------------------------------------------------------------

scholar:
  last_name: [Kathirvel]
  first_name: [Prabhakar, Ram]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters:
    - superscript
    - latex
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  group_by: year
  group_order: descending

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

sass:
  style: compressed

include: ["_pages"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - readme_preview/
  - UPGRADING.md
  - vendor

plugins:
  - jekyll-archives
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-toc
  - jemoji

# -----------------------------------------------------------------------------
# Archives
# -----------------------------------------------------------------------------

jekyll-archives:
  enabled: [year, tags, categories]
  layouts:
    year: archive-year
    tag: archive-tag
    category: archive-category
  permalinks:
    year: "/blog/:year/"
    tag: "/blog/tag/:name/"
    category: "/blog/category/:name/"